# Sample Compose setup for age-web-gateway.
# Copy to compose.yml, fill in the relay settings, then: docker compose up -d
# Unset/empty values fall back to the app defaults (see .env.example);
# environment variables take precedence over config file settings.

services:
  age-web-gateway:
    image: ghcr.io/dhcgn/age-web-gateway:latest
    ports:
      - "8080:8080"
    environment:
      # The app listens on LISTEN_ADDR inside the container; keep :8080 so it
      # matches the published port above.
      - LISTEN_ADDR=${LISTEN_ADDR:-:8080}
      - MAIL_BACKEND=${MAIL_BACKEND:-smtp}
      # SMTP relay (MAIL_BACKEND=smtp). The app default (localhost) is the
      # container itself, so SMTP_HOST is required here.
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required, e.g. smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@localhost}
      # Cloudflare Email API (MAIL_BACKEND=cloudflare). Only these three are
      # used by that backend; the SMTP_* vars above are ignored.
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_FROM=${CF_FROM:-}
      # Proof of Work: lookup difficulty, separate (higher) send difficulty,
      # token validity window.
      - POW_DIFFICULTY=${POW_DIFFICULTY:-16}
      - POW_DIFFICULTY_MAIL_SEND=${POW_DIFFICULTY_MAIL_SEND:-20}
      - POW_VALIDITY_SECONDS=${POW_VALIDITY_SECONDS:-60}
      # Empty = system resolver. Use host:port (e.g. 1.1.1.1:53) for a
      # validating resolver to get DNSSEC trust upgrades.
      - DNS_RESOLVER=${DNS_RESOLVER:-}
      - WELLKNOWN_TIMEOUT_SECONDS=${WELLKNOWN_TIMEOUT_SECONDS:-5}
      # Behind a reverse proxy, set the external origin(s), comma-separated,
      # e.g. https://age.example.com
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped

    # ── Alternative: Traefik instead of published ports ─────────────────────
    # Remove "ports:" above, attach the Traefik network, and uncomment:
    # networks:
    #   - traefik
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik"
    #   - "traefik.http.routers.age-web-gateway.rule=Host(`age.example.com`)"
    #   - "traefik.http.routers.age-web-gateway.entrypoints=websecure"
    #   - "traefik.http.routers.age-web-gateway.tls=true"
    #   - "traefik.http.routers.age-web-gateway.tls.certresolver=myresolver"
    #   - "traefik.http.services.age-web-gateway.loadbalancer.server.port=8080"

